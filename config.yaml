# 全局配置
global_settings:
  # 点位（绝对屏幕像素坐标，换分辨率/缩放比例必须重新标定）
  points:
    select_role:              # 游戏登录界面的角色选择下拉框
      x: 1930
      y: 1250
    tu_mi_daily_menu:         # 荼蘼左侧导航栏的"日常"菜单
      x: 123
      y: 87
    script_choose_base:       # 荼蘼第1行的"方案选择"框，其余行按 monitor_settings.row.height 推算
      x: 952
      y: 116
    script_run_base:          # 荼蘼第1行的"开始"按钮，其余行同上
      x: 1178
      y: 119
    script_dropdown_offset_y: 30   # 方案下拉列表展开后，第一个选项相对方案框的纵向偏移

  # 图像查找的搜索范围，缩小范围既能提速也能避免匹配到屏幕别处的相似内容
  # 注意四个数是 (左, 上, 宽, 高)，不是四个角的坐标
  regions:
    account_list:             # 账号下拉列表的搜索范围
      left: 2100
      top: 980
      width: 2220
      height: 1100
    script_list:              # 方案下拉列表的搜索范围；上边界由程序按角色所在行号算出，故此处不配 top
      left: 0
      width: 1500
      height: 1200

  images:
    init_known: "res/init_known.png"
    other_account: "res/other_account.png"
    logo: "res/logo.png"
    an_login: "res/an_account_login.png"
    login_enter_game: "res/login_enter_game.png"
    role_enter_game: "res/role_enter_game.png"
    account_selection: "res/account_selection.png"
    dream_server: "res/dream_server.png"
    dream_checkbox: "res/dream_checkbox.png"
    tu_mi_logo: "res/tu_mi_logo.png"
    tu_mi_main: "res/tu_mi_main.png"
    tu_mi_refresh: "res/tu_mi_refresh.png"   # 荼蘼的刷新按钮（双箭头图标）

  # 图像识别参数
  image_match:
    confidence: 0.8               # 图像匹配相似度阈值（0~1），调低更宽松但容易误匹配
    retry_interval_sec: 5         # 每次没找到图片后，等多久再重试
    default_max_retries: 200      # 找图的默认重试次数上限（未单独指定时用这个）

  # 各步骤找图的重试次数上限，超过即判定该步骤失败
  retries:
    other_account: 10             # 渠道服登录：切换到"其他账号"
    logo: 10                      # 渠道服登录：点击游戏logo
    an_login: 5                   # 渠道服登录：点击渠道服账号
    account_selection: 5          # 官服登录：展开账号下拉框
    login_enter_game: 5           # 官服登录：点击登录
    dream_checkbox: 1             # 取消勾选梦境私服（没勾选时本来就找不到，1次即可）
    role_enter_game: 5            # 角色选好后点击进入游戏
    tu_mi_refresh: 5              # 点击荼蘼的刷新按钮
    tu_mi_logo: 20                # 兜底路径：在屏幕上找荼蘼托盘图标。正常情况下会直接按窗口句柄
                                  # 唤出主窗口，根本走不到这里，所以给个有限次数，别一卡十几分钟
    tu_mi_script_select: 3        # 在荼蘼里"展开方案下拉列表->认出方案->点开始"整段的重试次数。
                                  # 列表被盖住/被收起来时就地重做整段，比让角色重新登录一次划算

  # 账号下拉列表的翻找设置：列表里账号很多时，要靠方向键逐条下移来找目标账号
  account_list_scroll:
    first_press_count: 6          # 第一轮先连按几次方向键（跳过顶部常用账号）
    next_press_min: 1             # 之后每轮随机按 min~max 次，避免固定步长永远错过某一条
    next_press_max: 3
    max_attempts: 20              # 最多找多少轮，超过判定找不到该账号
    channel_pagedown_count: 2     # 渠道服账号排在列表靠后，先整页往下翻几次再找

  # 登录页角色列表滚动查找设置
  # 账号下的角色较多时，要选的角色不会全部显示在首屏，需要向下滚动翻页才能找到
  role_list_scroll:
    point:              # 滚动时鼠标停放的位置，必须落在角色列表区域内（滚轮只对光标下的控件生效）
      x: 1930
      y: 1250
    clicks: -3          # 每次滚动的滚轮格数，负数向下；建议略小于一屏，宁可两屏重叠也不要跳过角色
    open_wait_sec: 3    # 点开角色下拉框后，等列表渲染出来的时间
    open_offset:        # 展开后把鼠标从下拉框上挪开的偏移量（向右上）。光标和悬停高亮会盖住
      x: 10             # 列表里的那一条，不挪开就认不出截图，表现为"滚了半天什么都找不到"
      y: -10
    max_scrolls: 6      # 单轮最多向下滚动次数（实际角色很少超过3页，这里留了余量）
    max_rounds: 4       # 从头到尾扫完一轮仍没找到时，重新展开列表+滚回顶部再来一轮的总轮数。
                        # 每轮开始都会重新点一次下拉框，而点击是"开/关"切换：列表本来就开着时
                        # 这一下会把它关上、下一轮才点回来，所以轮数要留出富余，不能只给3轮

  # 等待时间设置（单位：秒）。界面卡顿、机器较慢时可以整体调大
  delays:
    global: 2.0                   # 每次鼠标键盘操作后的统一等待（pyautogui.PAUSE）
    software_init: 20             # 荼蘼启动后等窗口出现的时长
    after_game_launch: 20         # 点开游戏启动器后，等客户端加载到登录界面
    after_tu_mi_logo: 5           # 点击荼蘼托盘图标后等主界面弹出
    after_login: 5                # 登录动作完成后的缓冲
    after_channel_login: 10       # 渠道服账号登录后等待跳转
    after_page_switch: 3          # 页面/列表切换后等重绘
    after_role_selected: 10       # 选好角色后等界面响应
    after_enter_game: 5           # 点击进入游戏后的缓冲
    after_script_dropdown: 3      # 展开荼蘼方案下拉列表后等列表渲染
    relogin_wait: 1800            # 启动时发现残留游戏窗口，关掉后要等多久才能重新登录（游戏的重复登录限制）

  # 各种等待超时（单位：秒），超过即放弃并记录日志
  timeouts:
    find_window: 15               # 按pid查找可见窗口
    bring_to_front: 20            # 把窗口移到前台
    wait_process: 30              # 等待某个进程启动
    timezone_warning: 5           # 等待荼蘼的时区警告弹窗出现。这个框是启动时立刻弹的，
                                  # 没弹就是不会弹了，等久了纯属白等（没弹也不影响后续流程）
    tu_mi_front: 5                # 荼蘼主界面出现后再置前一次
    find_tu_mi_window: 5          # 监控线程定位荼蘼窗口
    new_game_window: 30           # 等待新开的游戏客户端窗口出现
    kill_process: 5               # 结束进程后等它真正退出
    foreground_settle: 0.5        # 置前后等前台切换生效再复核（切换有延迟，别立刻就判定失败）
    poll_interval: 1              # 上述各类轮询的间隔

  # 软件位置
  software_path: "C:\\Users\\74484\\Downloads\\wyclx\\wyclx\\Launcher.exe"
  script_path: "C:\\Users\\74484\\Downloads\\荼蘼.exe"
  idv_login_path: "C:\\ProgramData\\idv-login\\点我启动工具.bat"

  # 进程识别关键字：按可执行文件路径中是否包含该关键字来定位进程
  process_keywords:
    tu_mi: '荼蘼'
    idv_login: 'idv-login'

  # 窗口标题与按钮文字。游戏/荼蘼改版或换语言版本时改这里，不用动代码
  titles:
    tu_mi: '荼蘼'                                          # 荼蘼主窗口标题
    clx: '一梦江湖'                                         # 游戏客户端窗口标题
    idv_channel_account: '网易渠道服工具 - Google Chrome'    # idv-login弹出的渠道服账号管理窗口标题
    timezone_warning: '.*警告.*'                            # 系统时区不是北京时间时荼蘼弹的警告框（正则）
    timezone_warning_button: '否(N)'                        # 上述警告框里"不修改时区"的按钮

  # 荼蘼弹框的统一处理。荼蘼的弹框都是模态的，弹出后整个荼蘼不可操作，而且它会抢走
  # "该进程第一个可见窗口"的位置，导致按pid找窗口时找到弹框、截图截到弹框、按坐标的点击
  # 全部落空——2026-08-09 就是一个"此窗口已存在于中控"的错误框没被关掉，阻塞了两个多小时。
  # 所以不再为每种弹框单独配标题正则，而是"荼蘼进程下除主窗口外的可见带标题窗口"一律视为弹框关掉。
  tu_mi_popup:
    # 默认按哪个按钮关闭，按顺序找到哪个点哪个。顺序是有讲究的：先点纯确认（确定/OK），
    # 再点保守的否定（否/取消），刻意不放"是(Y)"——没见过的弹框问"是否要xxx"时答"是"
    # 可能做出改系统设置这类不可逆的事，需要答"是"的弹框请在下面的overrides里单独配
    buttons: ['确定', 'OK', '否(N)', '取消', 'Cancel']
    overrides:                             # 特定弹框要点别的按钮：标题正则 -> 按钮候选
      - title_re: '.*警告.*'               # 时区警告框：点"否"，不修改系统时区
        buttons: ['否(N)']
    close_if_no_button: true               # 上面的按钮都点不到时，发WM_CLOSE兜底关闭

# 队列相关配置（脚本运行队列功能）
queue_settings:
  max_concurrent: 6          # 同时运行角色数（并发槽位，即"运行队列最大容量"），受内存限制且不能超过max_visible_rows
  pending_timeout_sec: 1800  # 待运行状态超时时间（30分钟），超时判定为失败
  max_retries: 3             # 自动重试次数上限，超过后标记为失败/待处理，需人工介入
  idle_poll_interval_sec: 5  # 并发槽位满时，调度器多久回头看一次有没有空出来
  wait_log_interval_sec: 60  # 调度器空转等待时，多久打印一次队列状态（避免刷屏）

# 荼蘼状态监控相关配置
monitor_settings:
  screenshot_interval_sec: 300  # 荼蘼状态截图轮询间隔（默认5分钟）
  max_visible_rows: 10           # 荼蘼面板可见的角色行数，需按实际界面校准
  stop_join_timeout_sec: 10      # 程序收尾时等监控线程退出的最长时间
  ui_lock_timeout_sec: 180       # 监控线程等"荼蘼界面锁"的上限：主流程正在注册脚本时监控要让路，
                                 # 等超过这个时间就跳过本轮，下一轮再看（绝不能把监控线程卡死）
  # 行底色判定的容差：某个通道比另两个通道高出这个数才算"偏该色"。
  # 已用真实截图校准——运行中的行是(144,238,144)浅绿，异常退出的行是(255,192,203)粉红，容差40能正确区分
  color_tolerance: 40
  row:
    top_y: 100                  # 第一行最上边缘的绝对y坐标（已标定）
    height: 40                  # 单行实际高度（已标定）
    content_left_x: 260         # 每行内容区左边缘（导航按钮右侧那条线）相对窗口最左边缘的x偏移（已标定）
    status_color_point:         # 用于取色判断行是否"运行中(绿)"的坐标（相对内容区左边缘+行最上边缘的偏移）
      x: 49
      y: 15
    status_text_region:         # 用于识别荼蘼原始状态文字的区域（相对内容区左边缘+行最上边缘的偏移：x1,y1,x2,y2）
      x1: 400
      y1: 0
      x2: 560
      y2: 40
  status_templates:             # 荼蘼各原始状态对应的文字模板图片，需实际截取后才能生效
    未启动: "res/tu_mi_status_not_started.png"
    初始化: "res/tu_mi_status_initializing.png"

# 队列运行数据存储相关配置
storage_settings:
  state_dir: "state"            # 每日状态JSON文件存放目录
  screenshot_dir: "screenshots" # 每轮监控截图存放目录
  retention_days: 30            # 数据保留天数，超过自动清理